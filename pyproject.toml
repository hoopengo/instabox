[project]
name = "instabox"
version = "0.1.0"
description = "Python SDK for the InstaBox API (https://instabox.sh) — cloud machines for agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "hoopengo", url = "https://github.com/hoopengo" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]
keywords = ["instabox", "sandbox", "cloud", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
instabox-mcp = "instabox.mcp:main"

[project.urls]
Documentation = "https://instabox.sh/docs"
Source = "https://github.com/hoopengo/instabox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp>=1.2,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instabox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
